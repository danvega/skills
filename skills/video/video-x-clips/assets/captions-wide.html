<!DOCTYPE html>
<!-- Word-by-word "karaoke pop" captions for X (Twitter) clips. SIZE-AGNOSTIC canvas
     (body = 100vw x 100vh): render at the clip's exact output size via
     video-motion-graphics/scripts/render.mjs --width/--height (1920x1080 for 16:9,
     1080x1080 for 1:1). Adapted from video-shorts/assets/captions.html — same contract,
     same style presets, sizes tuned down for the shorter canvas.
     Contract: window.setParams(obj), window.seek(t, total); all animation computed from t.
     Params:
       words:     [{word, start, end}, ...]  CLIP-RELATIVE seconds (video-shorts scripts/extract_words.py)
       style:     "hormozi" | "danvega" | "beast" | "clean" | "mono"   (default danvega)
       font, weight, fontSize, highlight, bottom   optional overrides of the preset
     Defaults here assume a 1080-tall canvas: bottom=90, sizes ~25% smaller than the
     9:16 presets. For 1:1 renders pass bottom:130.
-->
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 100vw; height: 100vh; background: transparent; overflow: hidden; }
  #wrap { position: absolute; left: 50%; transform: translateX(-50%); width: 85vw; text-align: center; }
  .line { position: relative; display: block; line-height: 1.18; }
  .layer { display: block; }
  .stroke { position: absolute; inset: 0; z-index: 0; }
  .fill { position: relative; z-index: 1; }
  /* spacing comes from margins, not text spaces — the active word's scale() doesn't affect
     layout, so a text space gets visually swallowed by the pop; margins keep a real gap. */
  .w { display: inline-block; }
</style></head><body>
<div id="wrap"></div>
<script>
// Same presets as the shorts template, sizes reduced for a 1080-tall canvas.
const STYLES = {
  hormozi: { font: "Montserrat", weight: 800, size: 62, upper: true,  max: 3, hl: "#2BFF53", stroke: 12, pop: 1.07, linePop: 1.04, fade: 0 },
  danvega: { font: "Komika Axis", weight: 400, size: 56, upper: true, max: 3, hl: "#8CE99A", stroke: 10, pop: 1.07, linePop: 1.04, gap: 0.22, fade: 0 },
  beast:   { font: "Impact",     weight: 400, size: 68, upper: true,  max: 4, hl: "#FFD400", stroke: 10, pop: 1.06, linePop: 1.04, fade: 0 },
  clean:   { font: "Poppins",    weight: 600, size: 50, upper: false, max: 4, hl: "#8CE99A", stroke: 8,  pop: 1.0,  linePop: 0,    fade: 0.06 },
  mono:    { font: "Menlo",      weight: 700, size: 44, lower: true,  max: 3, hl: "#69DB7C", stroke: 8,  pop: 1.04, linePop: 1.02, fade: 0 },
};
const MAX_GAP = 0.6;   // pause that forces a new caption group
const HOLD    = 0.35;  // keep the last word up briefly into a pause
const POP_DUR = 0.12;  // seconds for the active-word scale ease

let S = STYLES.danvega, groups = [];

window.setParams = (p) => {
  S = { ...STYLES[p.style || "danvega"] };
  if (p.font)      S.font = p.font;
  if (p.weight)    S.weight = p.weight;
  if (p.fontSize)  S.size = p.fontSize;
  if (p.highlight) S.hl = p.highlight;
  document.getElementById("wrap").style.bottom = (p.bottom || 90) + "px";

  const ws = p.words.map(w => ({ ...w, word: String(w.word).trim() })).filter(w => w.word);
  groups = []; let cur = [ws[0]];
  for (let i = 1; i < ws.length; i++) {
    const prev = ws[i - 1], w = ws[i];
    const brk = cur.length >= S.max || (w.start - prev.end) > MAX_GAP || /[.?!]$/.test(prev.word);
    if (brk) { groups.push(cur); cur = [w]; } else cur.push(w);
  }
  groups.push(cur);
};

const easeOutCubic = (x) => 1 - Math.pow(1 - x, 3);

window.seek = (t) => {
  const wrap = document.getElementById("wrap");
  let g = null;
  for (let i = 0; i < groups.length; i++) {
    const st = groups[i][0].start, en = groups[i][groups[i].length - 1].end;
    const until = Math.min(en + HOLD, i + 1 < groups.length ? groups[i + 1][0].start : Infinity);
    if (t >= st && t < until) { g = groups[i]; break; }
  }
  if (!g) { wrap.innerHTML = ""; return; }

  let ai = -1;
  for (let j = 0; j < g.length; j++) if (t >= g[j].start) ai = j;

  const xf = (w) => S.upper ? w.toUpperCase() : (S.lower ? w.toLowerCase() : w);
  const spans = (isFill) => g.map((w, j) => {
    let css = `margin:0 ${S.gap || 0.10}em;`;
    if (j === ai) {
      const k = easeOutCubic(Math.min(Math.max((t - w.start) / POP_DUR, 0), 1));
      css += `transform: scale(${(1 + (S.pop - 1) * k).toFixed(4)});`;
      if (isFill) css += `color: ${S.hl};`;
    }
    return `<span class="w" style="${css}">${xf(w.word)}</span>`;
  }).join("");

  const opacity = S.fade ? Math.min((t - g[0].start) / S.fade, 1) : 1;
  let lineScale = 1;
  if (S.linePop && ai >= 0) {
    const k = easeOutCubic(Math.min(Math.max((t - g[ai].start) / POP_DUR, 0), 1));
    lineScale = 1 + (S.linePop - 1) * k;
  }
  const base = `font-family:'${S.font}',sans-serif;font-weight:${S.weight};font-size:${S.size}px;` +
    `opacity:${opacity.toFixed(3)};transform:scale(${lineScale.toFixed(4)});`;
  wrap.innerHTML =
    `<div class="line" style="${base}">` +
    `<span class="layer stroke" style="color:#000;-webkit-text-stroke:${S.stroke}px #000;">${spans(false)}</span>` +
    `<span class="layer fill" style="color:#fff;text-shadow:0 6px 18px rgba(0,0,0,.45);">${spans(true)}</span>` +
    `</div>`;
};
</script></body></html>
