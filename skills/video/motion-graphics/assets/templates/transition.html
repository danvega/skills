<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!--
  transition: full-frame branded wipe (stinger) for a chapter cut.
  Place it AT the cut so peak coverage (t = total/2) lands on the seam.
  Contract (all templates in this library):
    window.setParams({...})  — set text/content before rendering
    window.seek(t, total)    — set the exact visual state for time t (seconds).
                               ALL animation lives here; no CSS animations/transitions.
  Canvas is 1920x1080. NOTE: unlike the cards, at peak this fills the frame opaquely —
  that opaque moment is what hides the cut.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; background: transparent; overflow: hidden; }

  .stage { position: absolute; inset: 0; overflow: hidden; }

  .panel {
    position: absolute;
    top: -8%; left: 0;
    width: 118%; height: 116%;           /* oversize so the skewed edges never gap */
    background: #0d110a;
    transform: translateX(-116%) skewX(-9deg);
    will-change: transform;
  }
  .edge {                                 /* bright accent on the leading edge */
    position: absolute; top: 0; bottom: 0; width: 14px;
    background: #8ce99a;
    box-shadow: 0 0 40px 6px rgba(140, 233, 154, 0.55);
  }
  .edge.lead  { right: -14px; }
  .edge.trail { left: -14px; opacity: 0.55; }

  .mark {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font: 700 120px/1 "SF Mono", Menlo, monospace;
    color: #8ce99a;
    letter-spacing: 0.02em;
    opacity: 0;
  }
  .mark .cur {
    display: inline-block; width: 46px; height: 104px;
    background: #8ce99a; margin-left: 14px; vertical-align: -10px;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="panel" id="panel">
      <div class="edge lead"></div>
      <div class="edge trail"></div>
    </div>
    <div class="mark" id="mark"><span id="glyph">$</span><span class="cur"></span></div>
  </div>

<script>
  window.setParams = function ({ glyph } = {}) {
    if (glyph) document.getElementById("glyph").textContent = glyph;
  };

  const easeInOutCubic = x => x < 0.5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2;
  const clamp01 = x => Math.max(0, Math.min(1, x));
  const seg = (t, a, b) => clamp01((t - a) / (b - a));

  window.seek = function (t, total) {
    total = total || 0.8;
    const panel = document.getElementById("panel");
    const mark  = document.getElementById("mark");

    // panel sweeps left -> right: -116% (off left) at t0, 0% (covers) at mid, 116% (off right) at end
    const p = easeInOutCubic(t / total);
    const x = -116 + p * 232;
    panel.style.transform = `translateX(${x.toFixed(3)}%) skewX(-9deg)`;

    // brand mark blinks in only around peak coverage
    const cover = clamp01(seg(t, total * 0.34, total * 0.5)) * (1 - clamp01(seg(t, total * 0.5, total * 0.66)));
    mark.style.opacity = cover.toFixed(4);
    mark.style.transform = `scale(${(0.92 + 0.08 * cover).toFixed(4)})`;
  };

  window.seek(0);
</script>
</body>
</html>
