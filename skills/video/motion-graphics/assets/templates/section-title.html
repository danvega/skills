<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!--
  section-title: chapter/topic card announcing a new section.
  Contract (all templates in this library):
    window.setParams({...})  — set text/content before rendering
    window.seek(t, total)    — set the exact visual state for time t (seconds).
                               ALL animation lives here; no CSS animations/transitions.
  Canvas is 1920x1080, background transparent.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; background: transparent; overflow: hidden; }

  .sect {
    position: absolute;
    left: 72px;
    bottom: 72px;               /* lower-third corner, same as the other cards */
    display: flex;
    align-items: stretch;
    gap: 26px;
  }
  .sect.right { left: auto; right: 72px; }

  .bar {
    width: 6px;
    background: #8ce99a;
    border-radius: 3px;
    transform-origin: top center;
    box-shadow: 0 0 22px rgba(140, 233, 154, 0.45);
  }

  /* backing card so the title reads on ANY footage — dark cam shot OR white screen-share */
  .text {
    padding: 22px 34px 26px;
    background: rgba(13, 17, 10, 0.88);
    border: 1px solid rgba(255, 255, 255, 0.10);
    border-radius: 14px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
  }
  .kicker {
    font: 600 22px/1 "SF Mono", Menlo, monospace;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #69db7c;
  }
  .clip { overflow: hidden; margin-top: 14px; }
  .title {
    font: 700 76px/1.04 -apple-system, "Inter", "Helvetica Neue", sans-serif;
    letter-spacing: -0.015em;
    color: #f4f7f2;
    white-space: pre;
  }
</style>
</head>
<body>
  <div class="sect" id="sect">
    <div class="bar" id="bar"></div>
    <div class="text">
      <div class="kicker" id="kicker">02 · Section</div>
      <div class="clip"><div class="title" id="title">The Retry Loop</div></div>
    </div>
  </div>

<script>
  window.setParams = function ({ num, title, kicker, side } = {}) {
    const k = kicker || (num ? num + " · Section" : null);
    if (k) document.getElementById("kicker").textContent = k;
    if (title) document.getElementById("title").textContent = title;
    if (side === "right") document.getElementById("sect").classList.add("right");
  };

  const easeOutCubic = x => 1 - Math.pow(1 - x, 3);
  const easeInCubic  = x => x * x * x;
  const clamp01 = x => Math.max(0, Math.min(1, x));
  const seg = (t, a, b) => clamp01((t - a) / (b - a));

  window.seek = function (t, total) {
    total = total || 4.0;
    const sect   = document.getElementById("sect");
    const bar    = document.getElementById("bar");
    const kicker = document.getElementById("kicker");
    const title  = document.getElementById("title");

    const pOut = easeInCubic(seg(t, total - 0.55, total - 0.10));
    sect.style.opacity   = (1 - pOut).toFixed(4);
    sect.style.transform = `translateX(${pOut * -22}px)`;

    // accent bar wipes down from the top
    const pBar = easeOutCubic(seg(t, 0.0, 0.42));
    bar.style.transform = `scaleY(${pBar.toFixed(4)})`;

    // kicker fades in with the bar
    kicker.style.opacity = seg(t, 0.15, 0.5).toFixed(4);

    // title rises out of its clip mask
    const pTitle = easeOutCubic(seg(t, 0.28, 0.78));
    title.style.transform = `translateY(${((1 - pTitle) * 100).toFixed(2)}%)`;
  };

  window.seek(0);
</script>
</body>
</html>
