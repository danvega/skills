<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!--
  lower-third: terminal card that types "$ whoami" and answers with name + role.
  Contract (all templates in this library):
    window.setParams({...})  — set text/content before rendering
    window.seek(t, total)    — set the exact visual state for time t (seconds).
                               ALL animation lives here; no CSS animations/transitions
                               (they are nondeterministic under frame-by-frame capture).
  Canvas is 1920x1080, background transparent.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; background: transparent; overflow: hidden; }

  .card {
    position: absolute;
    left: 72px;
    bottom: 72px;
    width: 620px;
    border-radius: 14px;
    background: rgba(13, 17, 10, 0.88);
    border: 1px solid rgba(255, 255, 255, 0.10);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
    overflow: hidden;
    opacity: 0;
    transform: translateY(46px);
  }
  /* placement override: seek() reads data-side="right" to mirror the card */
  .card.right { left: auto; right: 72px; }

  .chrome {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    background: rgba(255, 255, 255, 0.045);
    border-bottom: 1px solid rgba(255, 255, 255, 0.07);
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot.r { background: #ff5f57; }
  .dot.y { background: #febc2e; }
  .dot.g { background: #28c840; }
  .chrome .title {
    margin-left: 10px;
    font: 500 15px/1 "SF Mono", Menlo, monospace;
    color: rgba(255, 255, 255, 0.38);
    letter-spacing: 0.02em;
  }

  .body { padding: 20px 24px 22px; }

  .cmd {
    font: 500 21px/1.4 "SF Mono", Menlo, monospace;
    color: #8ce99a;
    white-space: pre;
  }
  .cmd .prompt { color: #69db7c; opacity: 0.9; }
  .cmd .typed { color: #d9e8d4; }
  .cursor {
    display: inline-block;
    width: 11px; height: 22px;
    background: #8ce99a;
    vertical-align: -3px;
    margin-left: 2px;
  }

  .answer { margin-top: 12px; overflow: hidden; }
  .answer-inner { transform: translateY(110%); }
  .name {
    font: 700 40px/1.15 -apple-system, "Inter", "Helvetica Neue", sans-serif;
    color: #f4f7f2;
    letter-spacing: -0.01em;
  }
  .role {
    margin-top: 4px;
    font: 500 19px/1.3 "SF Mono", Menlo, monospace;
    color: #8ce99a;
    opacity: 0;
  }
  .role::before { content: "▸ "; color: #69db7c; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="chrome">
      <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
      <div class="title" id="host">~/danvega — zsh</div>
    </div>
    <div class="body">
      <div class="cmd"><span class="prompt">$ </span><span class="typed" id="typed"></span><span class="cursor" id="cursor"></span></div>
      <div class="answer">
        <div class="answer-inner" id="answer">
          <div class="name" id="name">Dan Vega</div>
          <div class="role" id="role">Spring Developer Advocate</div>
        </div>
      </div>
    </div>
  </div>

<script>
  let CMD = "whoami";

  window.setParams = function ({ name, role, host, cmd, side } = {}) {
    if (name) document.getElementById("name").textContent = name;
    if (role) document.getElementById("role").textContent = role;
    if (host) document.getElementById("host").textContent = host;
    if (cmd)  CMD = cmd;
    if (side === "right") document.getElementById("card").classList.add("right");
  };

  const easeOutCubic = x => 1 - Math.pow(1 - x, 3);
  const easeInCubic  = x => x * x * x;
  const clamp01 = x => Math.max(0, Math.min(1, x));
  const seg = (t, a, b) => clamp01((t - a) / (b - a));

  window.seek = function (t, total) {
    total = total || 6.0;
    const card   = document.getElementById("card");
    const typed  = document.getElementById("typed");
    const cursor = document.getElementById("cursor");
    const answer = document.getElementById("answer");
    const role   = document.getElementById("role");

    // card in: slide up + fade                     card out: slide down + fade
    const pIn  = easeOutCubic(seg(t, 0.0, 0.45));
    const pOut = easeInCubic(seg(t, total - 0.55, total - 0.10));
    card.style.opacity   = (pIn * (1 - pOut)).toFixed(4);
    card.style.transform = `translateY(${(1 - pIn) * 46 + pOut * 46}px)`;

    // type the command, one char per tick
    const nChars = Math.floor(seg(t, 0.55, 1.15) * CMD.length);
    typed.textContent = CMD.slice(0, nChars);

    // cursor: solid while typing, blinks otherwise
    const typing = t > 0.4 && t < 1.2;
    const blinkOn = Math.floor(t / 0.45) % 2 === 0;
    cursor.style.opacity = (typing || blinkOn) ? 1 : 0;

    // answer: name rises out of the clip, role fades in after
    const pName = easeOutCubic(seg(t, 1.35, 1.80));
    answer.style.transform = `translateY(${(1 - pName) * 110}%)`;
    role.style.opacity = seg(t, 1.75, 2.15).toFixed(4);
  };

  window.seek(0);
</script>
</body>
</html>
