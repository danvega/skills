<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!--
  spotlight: dim the whole frame EXCEPT a rectangle, with a green highlight border.
  For code screen-share — draws the eye to the lines/method being discussed without a zoom.
  Contract (all templates in this library):
    window.setParams({...})  — set content/region before rendering
    window.seek(t, total)    — set the exact visual state for time t (seconds).
                               ALL animation lives here; no CSS animations/transitions.
  Canvas is 1920x1080, transparent. REGION IS FRACTIONAL (0–1 of the frame), so it is
  resolution-independent: measure the box on ANY frame as fractions and it maps at any --scale.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; background: transparent; overflow: hidden; }

  .hole {
    position: absolute;
    border: 3px solid #8ce99a;
    border-radius: 8px;
    /* the huge spread box-shadow is the dim: it fills everything OUTSIDE this element */
    box-shadow: 0 0 0 4000px rgba(4, 6, 3, 0.0), 0 0 26px 2px rgba(140, 233, 154, 0.0);
  }
  .label {
    position: absolute;
    left: 0;
    display: inline-block;
    padding: 7px 13px;
    border-radius: 8px;
    background: rgba(13, 17, 10, 0.92);
    border: 1px solid rgba(255, 255, 255, 0.10);
    font: 600 22px/1 "SF Mono", Menlo, monospace;
    letter-spacing: 0.02em;
    color: #8ce99a;
    white-space: nowrap;
    opacity: 0;
  }
  .label::before { content: "▸ "; color: #69db7c; }
</style>
</head>
<body>
  <div class="hole" id="hole"><div class="label" id="label"></div></div>

<script>
  // region as fractions of the frame; defaults roughly center a code block
  let R = { x: 0.30, y: 0.18, w: 0.55, h: 0.30 };
  let DIM = 0.62;          // max darkness of the area outside the box
  let LABEL = "";

  window.setParams = function ({ x, y, w, h, dim, label } = {}) {
    if (x != null) R.x = x; if (y != null) R.y = y;
    if (w != null) R.w = w; if (h != null) R.h = h;
    if (dim != null) DIM = dim;
    if (label != null) { LABEL = label; document.getElementById("label").textContent = label; }
  };

  const easeOutCubic = x => 1 - Math.pow(1 - x, 3);
  const easeInCubic  = x => x * x * x;
  const clamp01 = x => Math.max(0, Math.min(1, x));
  const seg = (t, a, b) => clamp01((t - a) / (b - a));

  window.seek = function (t, total) {
    total = total || 5.0;
    const hole  = document.getElementById("hole");
    const label = document.getElementById("label");
    const W = 1920, H = 1080;

    // position/size the hole from the fractional region
    hole.style.left   = (R.x * W).toFixed(1) + "px";
    hole.style.top    = (R.y * H).toFixed(1) + "px";
    hole.style.width  = (R.w * W).toFixed(1) + "px";
    hole.style.height = (R.h * H).toFixed(1) + "px";

    const pIn  = easeOutCubic(seg(t, 0.0, 0.40));
    const pOut = easeInCubic(seg(t, total - 0.50, total - 0.10));
    const k = pIn * (1 - pOut);                       // 0 → 1 → 0 envelope

    hole.style.boxShadow =
      `0 0 0 4000px rgba(4, 6, 3, ${(DIM * k).toFixed(4)}), ` +
      `0 0 26px 2px rgba(140, 233, 154, ${(0.55 * k).toFixed(4)})`;
    hole.style.borderColor = `rgba(140, 233, 154, ${k.toFixed(4)})`;

    // label sits just above the box (or below if the box hugs the top)
    const above = R.y > 0.12;
    label.style.top = above ? "-52px" : (R.h * H + 12).toFixed(1) + "px";
    label.style.opacity = LABEL ? (seg(t, 0.25, 0.5) * (1 - pOut)).toFixed(4) : "0";
  };

  window.seek(0);
</script>
</body>
</html>
