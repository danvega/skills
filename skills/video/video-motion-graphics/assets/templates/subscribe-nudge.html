<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!--
  subscribe-nudge: one-time like/subscribe reminder, terminal card.
  Contract (all templates in this library):
    window.setParams({...})  — set text/content before rendering
    window.seek(t, total)    — set the exact visual state for time t (seconds).
                               ALL animation lives here; no CSS animations/transitions.
  Canvas is 1920x1080, background transparent.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; background: transparent; overflow: hidden; }

  /* default bottom-LEFT: Dan's screen-share cam bubble sits bottom-right */
  .card {
    position: absolute;
    left: 72px;
    bottom: 72px;
    width: 560px;
    border-radius: 14px;
    background: rgba(13, 17, 10, 0.88);
    border: 1px solid rgba(255, 255, 255, 0.10);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
    overflow: hidden;
    opacity: 0;
    transform-origin: 12% 100%;
  }
  .card.right { left: auto; right: 72px; transform-origin: 88% 100%; }

  .chrome {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 16px;
    background: rgba(255, 255, 255, 0.045);
    border-bottom: 1px solid rgba(255, 255, 255, 0.07);
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot.r { background: #ff5f57; } .dot.y { background: #febc2e; } .dot.g { background: #28c840; }
  .chrome .title {
    margin-left: 10px;
    font: 500 15px/1 "SF Mono", Menlo, monospace;
    color: rgba(255, 255, 255, 0.38);
    letter-spacing: 0.02em;
  }

  .body { padding: 20px 24px 24px; }
  .cmd {
    font: 500 21px/1.4 "SF Mono", Menlo, monospace;
    color: #8ce99a;
    white-space: pre;
  }
  .cmd .prompt { color: #69db7c; opacity: 0.9; }
  .cursor {
    display: inline-block; width: 11px; height: 22px;
    background: #8ce99a; vertical-align: -3px; margin-left: 2px;
  }

  .btns { display: flex; gap: 14px; margin-top: 18px; }
  .btn {
    display: inline-flex; align-items: center; gap: 9px;
    padding: 12px 20px; border-radius: 10px;
    font: 600 20px/1 -apple-system, "Inter", "Helvetica Neue", sans-serif;
  }
  .btn.sub {
    background: #8ce99a; color: #0d110a;
    box-shadow: 0 6px 20px rgba(140, 233, 154, 0.35);
  }
  .btn.like {
    background: transparent; color: #f4f7f2;
    border: 1px solid rgba(255, 255, 255, 0.22);
  }
  .glyph { font-size: 19px; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="chrome">
      <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
      <div class="title" id="host">~/danvega — zsh</div>
    </div>
    <div class="body">
      <div class="cmd"><span class="prompt">$ </span><span id="typed"></span><span class="cursor" id="cursor"></span></div>
      <div class="btns" id="btns">
        <div class="btn sub"><span class="glyph">▶</span><span id="subtxt">Subscribe</span></div>
        <div class="btn like"><span class="glyph">♥</span>Like</div>
      </div>
    </div>
  </div>

<script>
  let CMD = "subscribe --channel \"Dan Vega\"";

  window.setParams = function ({ channel, cmd, side } = {}) {
    if (channel) CMD = 'subscribe --channel "' + channel + '"';
    if (cmd) CMD = cmd;
    if (side === "right") document.getElementById("card").classList.add("right");
  };

  const easeOutCubic  = x => 1 - Math.pow(1 - x, 3);
  const easeOutBack   = x => 1 + 2.2 * Math.pow(x - 1, 3) + 1.2 * Math.pow(x - 1, 2);
  const easeInCubic   = x => x * x * x;
  const clamp01 = x => Math.max(0, Math.min(1, x));
  const seg = (t, a, b) => clamp01((t - a) / (b - a));

  window.seek = function (t, total) {
    total = total || 6.0;
    const card   = document.getElementById("card");
    const typed  = document.getElementById("typed");
    const cursor = document.getElementById("cursor");
    const btns   = document.getElementById("btns");

    // card pops in with a slight overshoot; fades/settles out at the end
    const pIn  = clamp01(easeOutBack(seg(t, 0.0, 0.5)));
    const pOut = easeInCubic(seg(t, total - 0.55, total - 0.10));
    const scale = (0.9 + 0.1 * pIn) * (1 - 0.04 * pOut);
    card.style.opacity   = (clamp01(seg(t, 0, 0.28)) * (1 - pOut)).toFixed(4);
    card.style.transform = `translateY(${pOut * 24}px) scale(${scale.toFixed(4)})`;

    // type the command
    const nChars = Math.floor(seg(t, 0.55, 1.35) * CMD.length);
    typed.textContent = CMD.slice(0, nChars);
    const typing  = t > 0.5 && nChars < CMD.length;
    const blinkOn = Math.floor(t / 0.45) % 2 === 0;
    cursor.style.opacity = (typing || blinkOn) ? 1 : 0;

    // buttons rise in after the command finishes, subscribe pill breathes
    const pBtn = easeOutCubic(seg(t, 1.45, 1.9));
    const pulse = 1 + 0.035 * Math.sin((t - 1.9) * 3.4) * clamp01(seg(t, 1.9, 2.1)) * (1 - pOut);
    btns.style.opacity   = pBtn.toFixed(4);
    btns.style.transform = `translateY(${((1 - pBtn) * 16).toFixed(2)}px) scale(${pulse.toFixed(4)})`;
    btns.style.transformOrigin = "left center";
  };

  window.seek(0);
</script>
</body>
</html>
