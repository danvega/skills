<!doctype html>
<!--
  BIG-TYPE-LIGHT: paper-light background, huge dark ink type stacked left, Dan
  on the right third. The stands-out-in-a-dark-feed option — most tech
  thumbnails are dark, so this one pops in the sidebar.

  Rules here differ from the dark templates:
  - Accent green is the DARKER #2f9e4f (light backgrounds wash out #6cd97e).
  - Studio cutouts (black/dark polo) separate best; footage cutouts in gray
    polos go muddy — check separation at the shrink test.
  - The eyebrow pill replaces the giant wordmark: the type stack IS the hero.

  Copy to the scratchpad, fill the FOUR marked sections, render at 1920x1080 CSS px @1x → 1920×1080 PNG.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    font-family: "Inter", "SF Pro Display", -apple-system, sans-serif;
    background:
      radial-gradient(ellipse 1200px 900px at 82% 60%, rgba(47, 158, 79, 0.10), transparent 65%),
      radial-gradient(ellipse 1350px 1050px at 10% 10%, rgba(255, 255, 255, 0.9), transparent 70%),
      linear-gradient(135deg, #f4f6f0 0%, #e9eee5 60%, #dfe7db 100%);
    position: relative;
  }

  /* faint dot grid so the light field isn't sterile */
  .dots {
    position: absolute; inset: 0; opacity: 0.5;
    background-image: radial-gradient(rgba(16, 24, 18, 0.10) 3px, transparent 3px);
    background-size: 66px 66px;
  }

  .content { position: absolute; left: 108px; top: 96px; z-index: 3; }

  .eyebrow {
    display: inline-block; background: #101613; color: #fff;
    font-size: 51px; font-weight: 800; letter-spacing: 3px;
    padding: 21px 45px; border-radius: 21px;
    box-shadow: 0 12px 36px rgba(16, 22, 18, 0.25);
  }

  .stack { margin-top: 51px; }
  .stack .line {
    font-size: 222px; font-weight: 900; color: #101613;
    letter-spacing: -7.5px; line-height: 0.98;
  }
  .stack .line .accent { color: #2f9e4f; }

  .sub {
    margin-top: 54px; font-size: 54px; font-weight: 700; color: #4a5a4e;
    letter-spacing: 0;
  }

  .glow {
    position: absolute; right: -120px; bottom: -210px; width: 1140px; height: 1200px;
    background: radial-gradient(ellipse at center, rgba(16, 24, 18, 0.18), transparent 62%);
    z-index: 1;
  }
  img.dan {
    position: absolute; right: -60px; bottom: 0; height: 877.5px; z-index: 2;
    filter: drop-shadow(-24px 0 54px rgba(16, 22, 18, 0.35));
  }
</style>
</head>
<body>
  <div class="dots"></div>

  <div class="content">
    <!-- 1. EYEBROW: the subject/brand tag, 1-3 words, ALL CAPS reads best.
         This is small — it only needs to read at full size. -->
    <div class="eyebrow">SPRING AI</div>

    <!-- 2. TYPE STACK: the hook, one word per line, <=4 words total, wrap the
         ONE accent word in .accent. Longest line must end by x~840 so it
         clears the cutout — drop font-size to 192px if a line runs long. -->
    <div class="stack">
      <div class="line">FIXES</div>
      <div class="line">ITS <span class="accent">OWN</span></div>
      <div class="line">JSON</div>
    </div>

    <!-- 3. SUB (optional — delete if the stack fills the height): one quiet
         supporting phrase, no accent. -->
    <div class="sub">structured output, self-corrected</div>
  </div>

  <div class="glow"></div>
  <!-- 4. CUTOUT: studio shots with dark clothing pop on this background
       (smile-neutral.png is safe). Check gray/footage cutouts for mud at
       180px before committing. -->
  <img class="dan" src="/Users/vega/youtube/shared-assets/thumbnail/cutouts/point-surprised-tee.png">
</body>
</html>
