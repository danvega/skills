<!doctype html>
<!--
  ANNOTATED-CODE (hand-drawn direction, first template build): an IDE window
  with a few lines of syntax-colored code, a rough red marker ellipse around
  the interesting line, a rough arrow, and a rotated sticky-note sticker in a
  marker font; Dan points at the circled line from the right. Inspired by the
  red-arrow screenshot thumbnails on the board ("$15K/month", "CLONE AN APP
  10 MINS!"). Use when the hook is IN the code itself: spot the bug, this
  line costs you, one line fixes it.

  FILL: 1) window title (texture) 2) .code lines — keep to ~5 lines, 51px,
  the target line mid-block 3) reposition the two .scribble SVGs so the
  ellipse wraps ONLY the target line (stroke must not cross text) and the
  arrow runs sticker->ellipse 4) .sticker text (<=3 words — this is the real
  text budget) 5) pointing cutout, finger aimed at the circle. The red
  scribbles are the accent; sticker stays yellow. Render at 1920x1080 CSS px
  @1x -> 1920x1080.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    font-family: "Inter", "SF Pro Display", -apple-system, sans-serif;
    background: linear-gradient(150deg, #23272e 0%, #1b1f24 55%, #14171b 100%);
    position: relative;
  }

  /* IDE window fills most of the frame */
  .ide {
    position: absolute; left: 60px; top: 69px; z-index: 1; width: 1350px;
    background: #1e2227; border: 3px solid #3a4048; border-radius: 30px;
    box-shadow: 0 45px 120px rgba(0,0,0,0.6);
    overflow: hidden;
  }
  .ide .bar {
    display: flex; align-items: center; gap: 18px;
    background: #262b31; padding: 27px 36px; border-bottom: 3px solid #3a4048;
  }
  .ide .bar .b { width: 33px; height: 33px; border-radius: 50%; }
  .ide .bar .name {
    margin-left: 21px; font-family: "JetBrains Mono", Menlo, monospace;
    font-size: 39px; color: #9aa4af; font-weight: 700;
  }
  .code {
    padding: 45px 51px 54px; font-family: "JetBrains Mono", "SF Mono", Menlo, monospace;
    font-size: 51px; font-weight: 600; line-height: 1.62; white-space: pre;
  }
  .kw { color: #c678dd; } .ty { color: #e5c07b; } .st { color: #98c379; }
  .fn { color: #61afef; } .pl { color: #abb2bf; } .cm { color: #5c6370; }

  /* hand-drawn red ellipse + arrow */
  .scribble { position: absolute; z-index: 3; }

  .sticker {
    position: absolute; left: 1275px; top: 132px; z-index: 4;
    background: #ffd93b; color: #171310;
    font-family: "Marker Felt", "Chalkboard SE", "Comic Sans MS", cursive;
    font-size: 81px; font-weight: 700; letter-spacing: 0;
    padding: 39px 57px; border-radius: 12px;
    transform: rotate(6deg);
    box-shadow: 0 24px 66px rgba(0,0,0,0.55);
  }

  .glow {
    position: absolute; right: -105px; bottom: -195px; width: 1050px; height: 1140px;
    background: radial-gradient(ellipse at center, rgba(255, 74, 61, 0.10), transparent 62%);
    z-index: 1;
  }
  img.dan {
    position: absolute; right: -165px; bottom: 0; height: 810px; z-index: 2;
    filter: drop-shadow(-27px 0 60px rgba(0,0,0,0.6));
  }
</style>
</head>
<body>
  <div class="ide">
    <div class="bar">
      <div class="b" style="background:#ff5f57"></div>
      <div class="b" style="background:#febc2e"></div>
      <div class="b" style="background:#28c840"></div>
      <div class="name">UserService.java — generated by AI</div>
    </div>
    <div class="code"><span class="kw">public</span> <span class="ty">List</span>&lt;<span class="ty">User</span>&gt; <span class="fn">findUsers</span>(<span class="ty">String</span> <span class="pl">id</span>) {
  <span class="kw">var</span> <span class="pl">sql</span> = <span class="st">"SELECT * FROM users"</span>
      + <span class="st">" WHERE id = "</span> + <span class="pl">id</span>;
  <span class="kw">return</span> <span class="pl">jdbc</span>.<span class="fn">query</span>(<span class="pl">sql</span>, <span class="pl">mapper</span>);
}   <span class="cm">// tests: all green ✓</span></div>
  </div>

  <!-- rough red ellipse wrapping ONLY the string-concat line -->
  <svg class="scribble" style="left: 105px; top: 327px;" width="1110" height="180" viewBox="0 0 740 120" fill="none">
    <path d="M50 62 C 70 20, 620 10, 690 45 C 725 68, 640 104, 340 110 C 130 112, 30 96, 50 62 Z"
          stroke="#ff2e1f" stroke-width="9" stroke-linecap="round" fill="none"
          transform="rotate(-1 370 60)"/>
  </svg>
  <!-- rough arrow from sticker down-left to the ellipse's right end -->
  <svg class="scribble" style="left: 1185px; top: 247.5px;" width="300" height="210" viewBox="0 0 200 140" fill="none">
    <path d="M175 14 C 160 55, 115 85, 55 102" stroke="#ff2e1f" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M84 86 L50 105 L88 118" stroke="#ff2e1f" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </svg>

  <div class="sticker">spot the bug</div>

  <div class="glow"></div>
  <img class="dan" src="/Users/vega/youtube/shared-assets/thumbnail/cutouts/point-surprised-polo.png">
</body>
</html>
