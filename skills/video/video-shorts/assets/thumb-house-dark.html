<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  /* House DARK shorts thumbnail — dark green gradient + dot grid, Komika Axis title
     at -2deg with one green accent word, green underline rule, photo cutout at bottom.
     Replace {{KICKER}}, {{TITLE_HTML}} (use <br> line breaks + <span class="accent">WORD</span>
     on ONE word), and {{CUTOUT_PATH}} (absolute file:// path to a dan-*.png cutout). */
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; overflow:hidden; position:relative;
        background: linear-gradient(150deg,#0c1a10 0%,#08120b 55%,#060d08 100%); }
  .glow1 { position:absolute; width:1200px; height:1200px; left:-350px; top:-250px; border-radius:50%;
        background: radial-gradient(circle, rgba(108,217,126,0.16), transparent 65%); }
  .glow2 { position:absolute; width:1400px; height:1400px; left:-160px; bottom:-420px; border-radius:50%;
        background: radial-gradient(circle, rgba(108,217,126,0.20), transparent 62%); }
  .dots { position:absolute; inset:0;
        background-image: radial-gradient(rgba(159,199,168,0.13) 2.5px, transparent 2.5px);
        background-size: 64px 64px; }
  .kicker { position:absolute; top:96px; left:0; right:0; text-align:center;
        font-family:"SF Mono",Menlo,monospace; font-size:34px; letter-spacing:10px;
        color:#9fc7a8; }
  .title { position:absolute; top:190px; left:40px; right:40px; text-align:center;
        font-family:"Komika Axis",'Arial Black',sans-serif; color:#fff;
        font-size:148px; line-height:1.06; transform:rotate(-2deg);
        text-shadow: 0 10px 0 rgba(0,0,0,0.55), 0 24px 60px rgba(0,0,0,0.6); }
  .title .accent { color:#6cd97e; }
  .rule { position:absolute; left:290px; right:290px; top:700px; height:14px; border-radius:7px;
        background:#2ecc5e; box-shadow:0 6px 24px rgba(46,204,94,0.5); transform:rotate(-2deg); }
  .danglow { position:absolute; left:50%; bottom:-140px; transform:translateX(-50%);
        width:1250px; height:1250px; border-radius:50%;
        background: radial-gradient(circle, rgba(108,217,126,0.28), transparent 60%); }
  .dan { position:absolute; left:50%; bottom:0; transform:translateX(-50%);
        height:1150px; filter: drop-shadow(0 -6px 60px rgba(0,0,0,0.6)); }
</style></head><body>
  <div class="glow1"></div><div class="glow2"></div><div class="dots"></div>
  <div class="kicker">{{KICKER}}</div>
  <div class="title">{{TITLE_HTML}}</div>
  <div class="rule"></div>
  <div class="danglow"></div>
  <img class="dan" src="{{CUTOUT_PATH}}">
</body></html>
